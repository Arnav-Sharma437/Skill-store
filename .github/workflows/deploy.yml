name: Deploy Skill Store to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote Deployment via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_rsa

          {
            echo "### 🔍 VPS Deployment Diagnostics Report"
            echo "- **VPS_HOST**: \`$VPS_HOST\`"
            echo "- **VPS_USER**: \`$VPS_USER\`"
            echo "- **Key length**: \`${#SSH_PRIVATE_KEY}\` chars"
            echo "- **Key Fingerprint**:"
            ssh-keygen -l -f ~/.ssh/id_rsa || echo "Invalid key format"
            echo ""
            echo "- **Port 22 TCP Connectivity Test**:"
            if timeout 5 bash -c "</dev/tcp/${VPS_HOST}/22" 2>&1; then
              echo "✅ Port 22 reachable from GitHub runner"
            else
              echo "❌ Port 22 connection timed out or refused"
            fi
            echo ""
            echo "- **Verbose SSH Handshake Output**:"
            ssh -v -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes -i ~/.ssh/id_rsa -p 22 ${VPS_USER}@${VPS_HOST} "echo SSH_AUTHENTICATION_SUCCESS" 2>&1 || true
          } > /tmp/ssh_diag.txt

          # Post diagnostic output as commit comment
          jq -n --rawfile body /tmp/ssh_diag.txt '{body: $body}' | \
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
              -d @-

          # Run the actual deployment command
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -i ~/.ssh/id_rsa -p 22 ${VPS_USER}@${VPS_HOST} << 'EOF'
            set -e
            echo "🚀 Starting Skill Store deployment on VPS..."
            cd /var/www/skill-store
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build
            pm2 restart skill-store --update-env
            pm2 save
            echo "✅ Skill Store deployment completed successfully!"
          EOF

          rm -f ~/.ssh/id_rsa
