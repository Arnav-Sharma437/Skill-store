name: Deploy Skill Store to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote Deployment via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          exec > >(tee -a deploy.log) 2>&1
          echo "=== 1. Checking Secret Variables Presence ==="
          echo "VPS_HOST is: '${VPS_HOST}'"
          echo "VPS_USER is: '${VPS_USER}'"
          echo "SSH_PRIVATE_KEY length: ${#SSH_PRIVATE_KEY} chars"

          echo "=== 2. Testing Network Connectivity to Port 22 ==="
          timeout 5 bash -c "</dev/tcp/${VPS_HOST}/22" && echo "Port 22 reachable!" || echo "Port 22 connection timed out/refused!"

          echo "=== 3. Writing and inspecting SSH Key ==="
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_rsa

          echo "Deriving public key fingerprint from private key..."
          ssh-keygen -l -f ~/.ssh/id_rsa || echo "Invalid key format!"

          echo "=== 4. Testing SSH Handshake ==="
          ssh -v -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -i ~/.ssh/id_rsa -p 22 ${VPS_USER}@${VPS_HOST} << 'EOF'
            set -e
            echo "🚀 Starting Skill Store deployment on VPS..."
            cd /var/www/skill-store
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build
            pm2 restart skill-store --update-env
            pm2 save
            echo "✅ Skill Store deployment completed successfully!"
          EOF

      - name: Upload Deployment Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-debug-log
          path: deploy.log
