name: Deploy Skill Store to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote Deployment via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_rsa

          echo "## Skill Store Deployment Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "- **VPS_HOST**: \`$VPS_HOST\`" >> $GITHUB_STEP_SUMMARY
          echo "- **VPS_USER**: \`$VPS_USER\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Key length**: \`${#SSH_PRIVATE_KEY}\` chars" >> $GITHUB_STEP_SUMMARY

          KEY_INFO=$(ssh-keygen -l -f ~/.ssh/id_rsa 2>&1 || true)
          echo "- **Key Info**: \`$KEY_INFO\`" >> $GITHUB_STEP_SUMMARY

          echo "Testing TCP port 22..."
          if timeout 5 bash -c "</dev/tcp/${VPS_HOST}/22"; then
            echo "- **Port 22 Reachability**: ✅ Reachable" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Port 22 Reachability**: ❌ Connection Timed Out / Refused" >> $GITHUB_STEP_SUMMARY
          fi

          echo "Attempting SSH connection test..."
          SSH_TEST_OUT=$(ssh -v -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes -i ~/.ssh/id_rsa -p 22 ${VPS_USER}@${VPS_HOST} "echo SSH_CONNECTION_SUCCESSFUL" 2>&1 || true)
          
          echo "### SSH Output:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$SSH_TEST_OUT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Now execute deployment if test passed
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -i ~/.ssh/id_rsa -p 22 ${VPS_USER}@${VPS_HOST} << 'EOF'
            set -e
            echo "🚀 Starting Skill Store deployment on VPS..."
            cd /var/www/skill-store
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build
            pm2 restart skill-store --update-env
            pm2 save
            echo "✅ Skill Store deployment completed successfully!"
          EOF

          rm -f ~/.ssh/id_rsa
