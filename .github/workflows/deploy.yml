name: Deploy Skill Store to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting Skill Store deployment..."
            cd /var/www/skill-store
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build
            pm2 restart skill-store --update-env
            pm2 save
            echo "✅ Skill Store deployment completed successfully!"
