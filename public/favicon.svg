<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#121e38" />
      <stop offset="100%" stop-color="#1c2d52" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38b6ff" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38b6ff" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38b6ff" stroke-opacity="0.25" stroke-width="6" />

  <!-- Stylized "S" Emblem for Skill Store -->
  <g filter="url(#glow)">
    <!-- Top Bar of S -->
    <path
      d="M 370 145 C 370 125 350 110 310 110 L 195 110 C 150 110 120 135 120 180 C 120 225 155 245 205 255 L 290 270 C 330 278 350 295 350 330 C 350 375 315 402 265 402 L 150 402 C 125 402 110 390 105 375"
      fill="none"
      stroke="url(#primaryGrad)"
      stroke-width="54"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Interlocking Tech / Spark Accent on Top Right -->
    <polygon points="360,110 405,110 380,155 415,155 355,225 370,170 340,170" fill="url(#accentGrad)" />

    <!-- Center White/Cyan Core Spark -->
    <circle cx="205" cy="255" r="12" fill="#ffffff" />
    <circle cx="290" cy="270" r="12" fill="#ffffff" />
  </g>
</svg>
